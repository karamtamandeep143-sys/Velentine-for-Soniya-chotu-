<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Soniya 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #ffdde1, #ee9ca7);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 32px 28px 36px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2.2rem;
      margin: 0 0 10px;
      color: #e63946;
    }
    p {
      font-size: 1rem;
      color: #333;
      margin-bottom: 26px;
      line-height: 1.6;
    }
    .question {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 24px;
      color: #1d3557;
    }
    .buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
    }
    button {
      border: none;
      padding: 12px 22px;
      font-size: 1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button:active { transform: scale(0.95); }
    .yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: white;
      box-shadow: 0 10px 20px rgba(255,77,109,0.4);
    }
    .no {
      background: #f1f1f1;
      color: #555;
    }
    .result {
      display: none;
      margin-top: 22px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #e63946;
      animation: pop 0.5s ease forwards;
    }
    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 20px;
      animation: rise linear forwards;
      color: rgba(230,57,70,0.8);
      pointer-events: none;
    }
    @keyframes rise {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(-110vh) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hey Soniya 💕</h1>
    <p>From small smiles to big laughs, everything feels better when you're around.</p>
    <div class="question">Will you be my Valentine? 💘</div>
    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💖</button>
      <button class="no" onclick="moveNo(this)">No 🙈</button>
    </div>
    <div class="result" id="result">Yay! You just made this Valentine extra special 💞</div>
  </div>

  <script>
    function sayYes() {
      document.getElementById('result').style.display = 'block';
      for (let i = 0; i < 25; i++) createHeart();
    }
    function moveNo(btn) {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = '❤';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = 3 + Math.random() * 2 + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }
  </script>
</body>
</html>
